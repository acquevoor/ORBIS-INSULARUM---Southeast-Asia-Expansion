l_english:
 SEA_spice_storage:0 "Spice Convoys"
 SEA_spice_storage_desc:0 "Built to withstand long voyages and coastal engagements, these reinforced spice holds reflect the naval traditions of the maritime Malay realms. Their fleets are optimized for defending their home waters while transporting the precious spices that fuel their wealth and influence."

 SEA_piracy_fleet:0 "Lanun Raiders"
 SEA_piracy_fleet_desc:0 "Heavily armed fleets modeled after the feared lanun of the Sulu Sea and the Malay Archipelago, these ships are optimized for swift raids and disruption of enemy supply lines."
