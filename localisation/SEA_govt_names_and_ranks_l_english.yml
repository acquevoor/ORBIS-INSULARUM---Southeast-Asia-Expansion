 new_buddhist_events.1_decision: "Choose Personal Deity"
 new_buddhist_events.1_decision_desc: "Sometimes one regrets one's choices. Why should one's choice as a young [Root.Monarch.GetTitle] of which deity to follow apply for the rest of one's life? Fortunately, our arrangements with the Shrine Maiden allow us some flexibility on the matter."
 new_buddhist_events.1_decision_tt: "Has an §YEstate Privilege§! which allows the change of the Personal Deity"

