  #Minang Mechanics
 adat_minangkabau_legacy:0 "Penghulu Assembly"
 adat_minangkabau:0 "Penghulu Assembly"
 adat_minangkabau_desc:0 "The Penghulu Assembly is a confederation of clan leaders, where the most influential chieftains, appointed through matrilineal descent, gather to deliberate and guide the affairs of the realm."
 adat_minangkabau_legacy_desc:0 "The Penghulu Assembly is a council of clan leaders, where the most powerful chieftains, chosen through matrilineal lineage, hold sway in making decisions for the realm."

###################################################################################################################################
 malayan_plutocracy_reform:0 "Melayu Plutocracy"
 malayan_plutocracy_reform_desc:0 "Rooted in the thriving trade networks of the Malay world, the Melayu Plutocracy grants political influence to wealthy merchants and powerful trading elites. Their control over commerce ensures both economic prosperity and political stability, shaping the state's governance around the interests of maritime trade and regional influence."

#
 barangay_reform:0 "Barangay Confederation"
 barangay_reform_desc:0 "Formed from loosely connected coastal communities, the Barangay Confederation is led by local chieftains and councils. Power is decentralized, with each barangay managing its own affairs while cooperating for diplomacy, defense, and mutual aid. Leadership rests on negotiation and alliance between clans."

#
 barangay_oligarchic_republic_reform:0 "Barangay Oligarchy"
 barangay_oligarchic_republic_reform_desc:0 "Controlled by influential merchant clans and powerful lineages, the Barangay Oligarchy centralizes authority among wealthy families who dominate trade and foreign relations. Traditional councils remain, but true power lies with the leading commercial elites."

# 
 warrior_chieftaincy:0 "Warrior Chieftaincy"
 warrior_chieftaincy_desc:0 "Society is organized under the leadership of war leaders whose authority is rooted in personal prowess, clan loyalty, and martial tradition. Power is decentralized, with local chieftains maintaining authority over their communities, often competing or cooperating through shifting alliances and blood ties."

#
 highland_chieftaincy:0 "Highland Chieftaincy"
 highland_chieftaincy_desc:0 "In rugged and forested or highland regions, authority is dispersed among kinship-based councils and elder-led clans. Leadership balances communal decision-making, ancestral customs, and local autonomy, with little centralization beyond the village or valley level."

#Eastern Thalassocracy
 maritime_aristocracy:0 "Eastern Thalassocracy"
 maritime_aristocracy_desc:0 "Built upon powerful maritime clans, merchant houses, and seafaring aristocracies, the Eastern Thalassocracy draws its strength from trade, naval power, and coastal influence. Power is shared between noble lineages and wealthy traders who dominate commerce, foreign relations, and local governance across dispersed islands and ports."

#
 adat_minangkabau_ruler:0 "Pangulu"
 adat_minangkabau_ruler_female:0 "Bundo Kanduang"

#
 bobato_sultanate:0 "Bobato Kingdom"
 bobato_sultanate_desc:0 "Before becoming an Islamic Sultanate, the Bobato Kingdom was governed by a council of nobles and clan elders known as the Bobato. The ruler’s authority depended on maintaining the delicate balance between powerful aristocratic families, local chieftains, and influential merchant clans controlling trade, especially in valuable spices. Leadership was a mix of traditional animist customs and emerging political structures centered on maritime commerce."

#
 sarano_council:0 "Sarano Council"
 sarano_council_desc:0 "Governance is conducted by a structured council of nobles and hereditary office holders, guided by long-established customary law. Authority is shared between the ruler and the noble houses, whose influence is institutionalized through ranked positions and communal legal codes."

#
 bugis_arung_confederacy:0 "Arung Confederacy"
 bugis_arung_confederacy_desc:0 "Power is distributed among the Arung — hereditary nobles who govern their domains with considerable autonomy. The ruler relies on negotiation and alliance-building among these lords, while military, trade, and administration are balanced through shared authority and complex kinship ties."

#
 gowa_tallo_dual_regency:0 "Twin Kingship"
 gowa_tallo_dual_regency_desc:0 "Power is divided between two sovereign courts: one overseeing external affairs, military, and diplomacy; the other guiding internal governance, law, and religious matters. Unified through kinship and shared councils, this dual monarchy balances competing spheres of authority to preserve stability and expansion."

#
 luwu_confederation:0 "Luwu Confederation"
 luwu_confederation_desc:0 "A loose confederation of noble lineages and local chieftains, where power is shared among autonomous domains united by kinship and tradition. The ruler’s authority is balanced by a council of elders, reflecting a decentralized system rooted in consensus and customary law."

#
 imperial_mandala:0 "Imperial Mandala"
 imperial_mandala_desc:0 "The king reigns as the center of a ritual and political cosmos, with vassal lords and officials governing distant regions in exchange for tribute and allegiance. While central authority exists, power is dispersed through layered networks of loyalty and obligation."
 
 #
 barangay_oligarchic:0 "Barangay Oligarchy"
 barangay_oligarchic_desc:0 "Local leaders, or datu, rule small, autonomous communities called barangays. Power is shared among a council of elite families who govern through kinship ties, personal alliances, and consensus. Authority is decentralized, with leadership based on wealth, prestige, and warrior prowess rather than formal bureaucracy."

 maritime_muslim_aristocracy:0 "Maritime Muslim Aristocracy"
 maritime_muslim_aristocracy_desc:0 "Coastal Muslim elites govern through a network of powerful merchant families, religious scholars (ulama), and nobles. Authority is concentrated among aristocratic clans who control trade routes, enforce Islamic law, and maintain alliances through marriage and patronage. Leadership blends religious legitimacy with commercial and military power, ensuring dominance over strategic ports and maritime commerce."
